services:
  app:
    build: .
    ports:
      - "127.0.0.1:${HOST_PORT:-8000}:8000"
    environment:
      APP_DATA_DIR: /data
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      AI_WORKERS: ${AI_WORKERS:-1}
      AI_PRICING_FILE: ${AI_PRICING_FILE:-}
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/', timeout=2).close()"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    volumes:
      - data:/data
      - type: bind
        source: ./imports
        target: /imports
        read_only: true
        bind:
          create_host_path: true

volumes:
  data:
